name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Avalonia (headless) and MAUI (the platform-free net8.0 target) run anywhere
  avalonia-maui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test FastBinding.Avalonia.Tests -c Release
      - run: dotnet test FastBinding.MAUI.Tests -c Release -p:MauiCoreOnly=true

  # WPF needs Windows
  wpf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test FastBinding.Net5.Tests -c Release --logger "console;verbosity=normal"

  # the same WPF tests against FastBindings.WPF_50 1.1.3 as published (c0f53c7): which fail shows what each test catches
  wpf-1-1-3:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 1.1.3's FastBinding.Net5
        shell: bash
        run: |
          git rm -rq FastBinding.Net5 && git checkout c0f53c7 -- FastBinding.Net5
          rm FastBinding.Net5.Tests/DiagnosticsTests.cs   # FastBindingsDiagnostics is not in 1.1.3
      - run: dotnet test FastBinding.Net5.Tests -c Release --logger "console;verbosity=normal" --blame-hang-timeout 2m
